# CodeRabbit configuration.
# Reviews run on demand only. Trigger a review by commenting on the pull
# request with:  @coderabbitai review
language: en-US
reviews:
  profile: assertive
  auto_review:
    enabled: false
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
chat:
  auto_reply: true
