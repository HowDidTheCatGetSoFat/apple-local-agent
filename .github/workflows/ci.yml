name: CI

on:
  push:
    branches: [main]
    paths:
      - "bin/**"
      - "lib/**"
      - "**/*.sh"
      - "rag/**"
      - "graph/**"
      - "gateway/**"
      - "media/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "bin/**"
      - "lib/**"
      - "**/*.sh"
      - "rag/**"
      - "graph/**"
      - "gateway/**"
      - "media/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Syntax check
        run: bash -n bin/fxlla lib/core.sh tests/run.sh

      - name: ShellCheck
        # Pinned to a release SHA: @master runs whatever that repo's tip is.
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: "."
          additional_files: "fxlla"
          # Severity stays at the default. Lowering it to `warning` would make
          # CI green, but it is a global floor, not a filter: SC2086 (unquoted
          # expansion) is only `info`, and that is precisely the bug class this
          # repo cannot afford to stop seeing, since half of it builds paths.
          # Findings that are deliberate carry an inline `shellcheck disable`
          # with the reason, next to the code.
        env:
          SHELLCHECK_OPTS: -e SC1090 -e SC1091

      # Every tests/test_*.sh, discovered by glob. A new suite runs the moment
      # it exists - it used to need naming here and in the syntax check above,
      # and a suite nobody remembered to add looked just like a passing one.
      # The runner also fails any suite that exits 0 without asserting anything.
      - name: Shell tests
        run: bash tests/run.sh

  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests
        run: FXLLA_STORE=/tmp python3 -m unittest rag.test_rag graph.test_graph gateway.test_gateway gateway.test_metrics gateway.test_gateway_e2e media.test_media evals.test_evals agent.test_loop gateway.test_ggufmeta -v

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0 # no floating v9 tag exists; majors stop at v7
        with:
          # No uv.lock or requirements file in this repo (dependencies come from
          # `uv run --with`), so a cache key would never invalidate.
          enable-cache: false

      - name: Extension-backed tests (kuzu, sqlite-vec, tree-sitter)
        # Exercise the code-graph and RAG-index tests that self-skip without the
        # optional extensions, so they run for real in CI instead of skipping.
        run: FXLLA_STORE=/tmp uv run --with "kuzu==0.11.3" --with sqlite-vec --with tree-sitter --with tree-sitter-language-pack --no-project python -m unittest rag.test_rag graph.test_graph -v
