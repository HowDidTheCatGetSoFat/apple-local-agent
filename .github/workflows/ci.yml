name: CI

on:
  push:
    branches: [main]
    paths:
      - "bin/**"
      - "lib/**"
      - "**/*.sh"
      - "rag/**"
      - "graph/**"
      - "gateway/**"
      - "media/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "bin/**"
      - "lib/**"
      - "**/*.sh"
      - "rag/**"
      - "graph/**"
      - "gateway/**"
      - "media/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n bin/fxlla lib/core.sh tests/test_config.sh tests/test_completions.sh tests/test_avail.sh

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          additional_files: "fxlla"
        env:
          SHELLCHECK_OPTS: -e SC1090 -e SC1091

      - name: Config precedence tests
        run: bash tests/test_config.sh

      - name: Completion tests
        run: bash tests/test_completions.sh

      - name: Availability tests
        run: bash tests/test_avail.sh

  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: FXLLA_STORE=/tmp python3 -m unittest rag.test_rag graph.test_graph gateway.test_gateway gateway.test_metrics gateway.test_gateway_e2e media.test_media -v
