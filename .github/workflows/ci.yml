name: CI

on:
  push:
    branches: [main]
    paths:
      - "bin/**"
      - "lib/**"
      - "**/*.sh"
      - "rag/**"
      - "graph/**"
      - "gateway/**"
      - "media/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "bin/**"
      - "lib/**"
      - "**/*.sh"
      - "rag/**"
      - "graph/**"
      - "gateway/**"
      - "media/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Syntax check
        run: bash -n bin/fxlla lib/core.sh tests/test_config.sh tests/test_completions.sh tests/test_avail.sh tests/test_skills.sh tests/test_civitai.sh tests/test_pull.sh tests/test_ram.sh tests/test_wire.sh tests/test_media_weights.sh tests/test_consent.sh

      - name: ShellCheck
        # Pinned to a release SHA: @master runs whatever that repo's tip is.
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: "."
          additional_files: "fxlla"
        env:
          SHELLCHECK_OPTS: -e SC1090 -e SC1091

      - name: Config precedence tests
        run: bash tests/test_config.sh

      - name: Completion tests
        run: bash tests/test_completions.sh

      - name: Availability tests
        run: bash tests/test_avail.sh

      - name: Skills tests
        run: bash tests/test_skills.sh

      - name: Civitai tests
        run: bash tests/test_civitai.sh

      - name: Pull tests
        run: bash tests/test_pull.sh

      - name: RAM persist tests
        run: bash tests/test_ram.sh

      - name: Wire tests
        run: bash tests/test_wire.sh

      - name: Media weight catalog tests
        run: bash tests/test_media_weights.sh

      - name: Download consent tests
        run: bash tests/test_consent.sh

  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests
        run: FXLLA_STORE=/tmp python3 -m unittest rag.test_rag graph.test_graph gateway.test_gateway gateway.test_metrics gateway.test_gateway_e2e media.test_media -v

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0 # no floating v9 tag exists; majors stop at v7
        with:
          # No uv.lock or requirements file in this repo (dependencies come from
          # `uv run --with`), so a cache key would never invalidate.
          enable-cache: false

      - name: Extension-backed tests (kuzu, sqlite-vec, tree-sitter)
        # Exercise the code-graph and RAG-index tests that self-skip without the
        # optional extensions, so they run for real in CI instead of skipping.
        run: FXLLA_STORE=/tmp uv run --with "kuzu==0.11.3" --with sqlite-vec --with tree-sitter --with tree-sitter-language-pack --no-project python -m unittest rag.test_rag graph.test_graph -v
