name: App

# macOS only, and only when the app changes, so the paid macOS runner stays idle
# on ordinary PRs. Guards compilation; signing and notarization stay local.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Swift build
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build (unsigned)
        run: app/build.sh

      - name: Bundle contents
        # The app ships the CLI so an install from the .dmg is self-contained,
        # and must never ship config/config.env, which holds the user's tokens.
        run: |
          cli="app/fxlla.app/Contents/Resources/cli"
          for d in bin lib config gateway rag graph media skills; do
            test -d "$cli/$d" || { echo "missing $d in the bundled CLI" >&2; exit 1; }
          done
          test -x "$cli/bin/fxlla" || { echo "bundled fxlla is not executable" >&2; exit 1; }
          if [ -e "$cli/config/config.env" ]; then
            echo "config.env must never be bundled" >&2; exit 1
          fi
          "$cli/bin/fxlla" help >/dev/null || { echo "bundled CLI does not run" >&2; exit 1; }
          # The installed command is a symlink into the bundle, so check that
          # path too: bin/fxlla resolves symlinks to find its own REPO_ROOT, and a
          # regression there would break the installed CLI while the direct call
          # above still passed.
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          ln -s "$PWD/$cli/bin/fxlla" "$tmp/fxlla"
          "$tmp/fxlla" help >/dev/null || { echo "symlinked bundled CLI does not run" >&2; exit 1; }
          # media models reads the bundled media/generate.py, which needs a store
          # directory to exist; the runner has none, so point it at the scratch dir.
          mkdir -p "$tmp/store"
          FXLLA_STORE="$tmp/store" "$tmp/fxlla" media models >/dev/null \
            || { echo "symlinked CLI cannot reach its modules" >&2; exit 1; }
          echo "bundled CLI verified"
