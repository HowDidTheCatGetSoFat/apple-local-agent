name: CodeQL

# Analyzes the Python sources (gateway, rag, graph, media) and the workflow
# files. Python was dropped early on because the repo had none yet and CodeQL
# fails the run when a configured language has no source; it does now, so it is
# back. Swift is deliberately absent: CodeQL needs a real build for it, which
# would spend macOS runner minutes on every change (app.yml is path-filtered to
# avoid exactly that).
on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "**.py"
      - ".github/workflows/**"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
