# Model catalog. Format:
#   alias | hf_repo | approx size | role | engine | note
#
# engine: mlx (default) or gguf.
# `fxlla pull <alias>` uses this line. `fxlla pull <org/repo> [--gguf] [--quant X]`
# also works with any Hugging Face repository.
# Sizes are approximate download sizes (decimal GB), and they mean EVERYTHING
# the pull fetches, not the weights file. A vision repo ships one or more
# multimodal projectors and the pull takes every one, so a row written from the
# weights alone runs under - `abliterated-27b` said 22GB and fetched 23.6. This
# number is what an agent quotes to a user before a download, so it is the one
# they consent against.
#
# role 'embed' models feed `fxlla kb`. Pick one with FXLLA_EMBED_MODEL; it
# defaults to 'embed'. The dimension in each note is read from the GGUF itself,
# and it decides compatibility: a knowledge base built at one width cannot be
# searched at another, so switching models means `fxlla kb reindex <name>`.
# Pooling is not configured anywhere because every one of these declares its own
# pooling_type and llama.cpp honours it.
#
# role 'vision' is a claim about quality, not about hardware, and the gateway
# treats it as one. It means the eyes were meant to be used: a model with this
# role and a projector on disk is handed images untouched, and is eligible to
# read them on another model's behalf. Leaving it off is the safe default, so a
# model that inherited a vision tower from its base and never tuned it belongs
# under whatever it is actually good at - it will still be given a description
# rather than trusted with the image. Measure before granting this.

tiny              | mlx-community/Qwen2.5-Coder-0.5B-Instruct-4bit                       | 0.3GB  | test    | mlx  | Toy model to validate the pipeline in ~2 min (not for real coding).
coder-1.5b        | mlx-community/Qwen2.5-Coder-1.5B-Instruct-4bit                       | 0.9GB  | dev     | mlx  | Small, very fast startup.
coder-3b          | mlx-community/Qwen2.5-Coder-3B-Instruct-4bit                         | 1.7GB  | dev     | mlx  | Small and already usable.
qwen3-coder       | mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit                      | 17GB   | dev     | mlx  | Daily driver. MoE with ~3B active, very fast.
qwen3-coder-8bit  | mlx-community/Qwen3-Coder-30B-A3B-Instruct-8bit                      | 32GB   | dev     | mlx  | Same but 8-bit, higher quality.
qwen2.5-coder-32b | mlx-community/Qwen2.5-Coder-32B-Instruct-4bit                        | 18GB   | dev     | mlx  | Dense 32B, solid alternative.
glm-air           | mlx-community/GLM-4.5-Air-4bit                                       | 60GB   | agentic | mlx  | Strong at agentic coding.
gpt-oss-120b      | mlx-community/gpt-oss-120b-MXFP4-Q8                                  | 63GB   | agentic | mlx  | Reasoning and tool use.
qwen3-235b        | mlx-community/Qwen3-235B-A22B-Instruct-2507-4bit                    | 132GB  | max     | mlx  | The ceiling. Requires 'fxlla ram auto'.
redteam-gguf      | mradermacher/Huihui-Qwen3-Coder-30B-A3B-Instruct-abliterated-i1-GGUF | 19GB   | redteam | gguf | Lightest uncensored (30B-A3B, imatrix GGUF). Use: --quant Q4_K_M
coder32-gguf      | bartowski/Qwen2.5-Coder-32B-Instruct-GGUF                           | 20GB   | dev     | gguf | GGUF, many quants. Use: --quant Q4_K_M
redteam-4bit      | veeceey/Huihui-Qwen3-Coder-Next-abliterated-mlx-4bit                | 45GB   | redteam | mlx  | Uncensored, larger Qwen3-Coder-Next (MLX 4-bit).
vision            | ggml-org/Qwen2.5-VL-7B-Instruct-GGUF                                | 7GB    | vision  | gguf | Qwen2.5-VL 7B. The only model here that can SEE: pull with --quant Q4_K_M and the multimodal projector comes with it. Reads text inside an image, which is what checking a render needs. mlx_lm.server refuses image content, so vision runs on llama-server (gguf) - not a limitation of the weights.
redteam           | AITRADER/Huihui-Qwen3-Coder-Next-abliterated-mlx-8Bit               | 85GB   | redteam | mlx  | Uncensored, larger Qwen3-Coder-Next (MLX 8-bit, top quality).
embed             | nomic-ai/nomic-embed-text-v1.5-GGUF                                 | 0.1GB  | embed   | gguf | Default for 'fxlla kb'. 768-dim, 2k context. Use: --quant Q5_K_M
embed-small       | CompendiumLabs/bge-small-en-v1.5-gguf                               | 0.04GB | embed   | gguf | Smallest and quickest. 384-dim, 512 context, English. Use: --quant q8_0
embed-large       | CompendiumLabs/bge-large-en-v1.5-gguf                               | 0.36GB | embed   | gguf | Higher quality English. 1024-dim, 512 context. Use: --quant q8_0
embed-gemma       | ggml-org/embeddinggemma-300M-GGUF                                   | 0.33GB | embed   | gguf | Multilingual, 2025. 768-dim, 2k context, single quant.
embed-qwen3       | Qwen/Qwen3-Embedding-0.6B-GGUF                                      | 0.64GB | embed   | gguf | Multilingual, long context. 1024-dim, 32k context. Use: --quant Q8_0
qwythos           | empero-ai/Qwythos-27B-v1-GGUF                                        | 23.7GB | dev     | gguf | Dense 27B on Qwen3.5, hybrid attention: 262k trained window costs 16 GB of KV where a dense one costs 64. Pull with --quant 27B-MTP-Q6_K - that build carries a multi-token-prediction head and fxlla serves it with self-speculation, measured head to head at a matched 32k window, 31.9 vs 20.6 tok/s on code. Ships a vision projector the 27B card says was never tuned, so it is NOT role vision and gets a description like any other. Reasoning model: give it room or it thinks past its budget. Intentionally uncensored by training. Weights Apache-2.0. The 27B card says it was trained on the same curriculum as this publisher's 9B, whose card describes that curriculum as distilled from Claude traces - so the lineage is stated one model removed, not on this card.
abliterated-27b   | mradermacher/Huihui-Qwen3.5-27B-abliterated-GGUF                     | 23.6GB | redteam | gguf | Qwen3.5-27B with the refusal direction orthogonalized out (Huihui). Same base as qwythos, opposite route: one was trained without alignment, this had it removed. 22.1GB of weights plus both projectors this repo ships (1.6GB) - the row said 22GB while the pull fetched 23.6. Use: --quant Q6_K
qwen3.5-9b        | mradermacher/Qwen3.5-9B-GGUF                                        | 8.9GB  | dev     | gguf | Stock Qwen3.5 at 9B, no fine-tune. Q6_K on purpose: the 4B and 27B builds of this family here are the same publisher at the same quant, so the three sizes differ in size and nothing else - which is what makes an abliterated-versus-base comparison mean anything. The size is 7.4GB of weights plus BOTH projectors this repo ships (f16 and Q8_0, 1.5GB together) - fxlla takes every projector rather than guess which one pairs. Untuned eyes as far as the card says, so NOT role vision. Reasoning model: measured here spending about 7.9k characters of reasoning_content on a one-sentence question, so a tight max_tokens returns an empty answer rather than a short one. Use: --quant Q6_K
gemma-4-12b-qat   | google/gemma-4-12B-it-qat-q4_0-gguf                                 | 7.2GB  | dev     | gguf | Gemma 4 12B, quantization-aware trained rather than quantized afterwards: the 4-bit weights are what it was tuned to end up at, so it loses less than a q4_0 of the same model would. Google's own GGUF build, single quant, no --quant needed. Sized for a 16 GB machine, which is not this one - here it is the small end. Apache-2.0. Google also publishes a QAT build in compressed-tensors (w4a16-ct); that one is for vLLM and llama.cpp cannot read it. Reasoning model, and a quiet one: it spends the budget thinking before it writes, so a short max_tokens returns an empty answer with the whole reply sitting in reasoning_content - give it room. Ships a projector and its own eyes work: with FXLLA_VISION_ROUTING=0, so nothing could answer for it, it read the colour of a shape correctly. Left at role dev anyway - role vision is what the gateway hands an image to when a model that lacks it is asked to read one, and which model gets that job stays a deliberate choice rather than whatever ships a projector.
