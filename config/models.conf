qwen3-coder-8bit  | mlx-community/Qwen3-Coder-30B-A3B-Instruct-8bit                      | 32GB   | dev     | mlx  | Same but 8-bit, higher quality.
qwen2.5-coder-32b | mlx-community/Qwen2.5-Coder-32B-Instruct-4bit                        | 18GB   | dev     | mlx  | Dense 32B, solid alternative.
glm-air           | mlx-community/GLM-4.5-Air-4bit                                       | 60GB   | agentic | mlx  | Strong at agentic coding.
gpt-oss-120b      | mlx-community/gpt-oss-120b-MXFP4-Q8                                  | 63GB   | agentic | mlx  | Reasoning and tool use.
qwen3-235b        | mlx-community/Qwen3-235B-A22B-Instruct-2507-4bit                    | 132GB  | max     | mlx  | The ceiling. Requires 'fxlla ram auto'.
redteam-gguf      | mradermacher/Huihui-Qwen3-Coder-30B-A3B-Instruct-abliterated-i1-GGUF | 19GB   | redteam | gguf | Lightest uncensored (30B-A3B, imatrix GGUF). Use: --quant Q4_K_M
coder32-gguf      | bartowski/Qwen2.5-Coder-32B-Instruct-GGUF                           | 20GB   | dev     | gguf | GGUF, many quants. Use: --quant Q4_K_M
redteam-4bit      | veeceey/Huihui-Qwen3-Coder-Next-abliterated-mlx-4bit                | 45GB   | redteam | mlx  | Uncensored, larger Qwen3-Coder-Next (MLX 4-bit).
vision            | ggml-org/Qwen2.5-VL-7B-Instruct-GGUF                                | 7GB    | vision  | gguf | Qwen2.5-VL 7B. The only model here that can SEE: pull with --quant Q4_K_M and the multimodal projector comes with it. Reads text inside an image, which is what checking a render needs. mlx_lm.server refuses image content, so vision runs on llama-server (gguf) - not a limitation of the weights.
redteam           | AITRADER/Huihui-Qwen3-Coder-Next-abliterated-mlx-8Bit               | 85GB   | redteam | mlx  | Uncensored, larger Qwen3-Coder-Next (MLX 8-bit, top quality).
embed             | nomic-ai/nomic-embed-text-v1.5-GGUF                                 | 0.1GB  | embed   | gguf | Default for 'fxlla kb'. 768-dim, 2k context. Use: --quant Q5_K_M
embed-small       | CompendiumLabs/bge-small-en-v1.5-gguf                               | 0.04GB | embed   | gguf | Smallest and quickest. 384-dim, 512 context, English. Use: --quant q8_0
embed-large       | CompendiumLabs/bge-large-en-v1.5-gguf                               | 0.36GB | embed   | gguf | Higher quality English. 1024-dim, 512 context. Use: --quant q8_0
embed-gemma       | ggml-org/embeddinggemma-300M-GGUF                                   | 0.33GB | embed   | gguf | Multilingual, 2025. 768-dim, 2k context, single quant.
embed-qwen3       | Qwen/Qwen3-Embedding-0.6B-GGUF                                      | 0.64GB | embed   | gguf | Multilingual, long context. 1024-dim, 32k context. Use: --quant Q8_0
qwythos           | empero-ai/Qwythos-27B-v1-GGUF                                        | 23GB   | dev     | gguf | Dense 27B on Qwen3.5, hybrid attention: 262k trained window costs 16 GB of KV where a dense one costs 64. Pull with --quant 27B-MTP-Q6_K - that build carries a multi-token-prediction head and fxlla serves it with self-speculation, measured 36 vs 21 tok/s on code. Ships a vision projector its own author says was never tuned, so it is NOT role vision and gets a description like any other. Reasoning model: give it room or it thinks past its budget. Intentionally uncensored by training. Weights Apache-2.0; the publisher describes the training as distilled from Claude traces.
abliterated-27b   | mradermacher/Huihui-Qwen3.5-27B-abliterated-GGUF                     | 22GB   | redteam | gguf | Qwen3.5-27B with the refusal direction orthogonalized out (Huihui). Same base as qwythos, opposite route: one was trained without alignment, this had it removed. Use: --quant Q6_K
