# Model catalog. Format:
#   alias | hf_repo | approx size | role | engine | note
#
# engine: mlx (default) or gguf.
# `fxlla pull <alias>` uses this line. `fxlla pull <org/repo> [--gguf] [--quant X]`
# also works with any Hugging Face repository.
# Sizes are approximate download sizes (decimal GB).

tiny              | mlx-community/Qwen2.5-Coder-0.5B-Instruct-4bit                       | 0.3GB | test    | mlx  | Toy model to validate the pipeline in ~2 min (not for real coding).
coder-1.5b        | mlx-community/Qwen2.5-Coder-1.5B-Instruct-4bit                       | 0.9GB | dev     | mlx  | Small, very fast startup.
coder-3b          | mlx-community/Qwen2.5-Coder-3B-Instruct-4bit                         | 1.7GB | dev     | mlx  | Small and already usable.
qwen3-coder       | mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit                      | 17GB  | dev     | mlx  | Daily driver. MoE with ~3B active, very fast.
qwen3-coder-8bit  | mlx-community/Qwen3-Coder-30B-A3B-Instruct-8bit                      | 32GB  | dev     | mlx  | Same but 8-bit, higher quality.
qwen2.5-coder-32b | mlx-community/Qwen2.5-Coder-32B-Instruct-4bit                        | 18GB  | dev     | mlx  | Dense 32B, solid alternative.
glm-air           | mlx-community/GLM-4.5-Air-4bit                                       | 60GB  | agentic | mlx  | Strong at agentic coding.
gpt-oss-120b      | mlx-community/gpt-oss-120b-MXFP4-Q8                                  | 63GB  | agentic | mlx  | Reasoning and tool use.
qwen3-235b        | mlx-community/Qwen3-235B-A22B-Instruct-2507-4bit                    | 132GB | max     | mlx  | The ceiling. Requires 'fxlla ram auto'.
redteam-gguf      | mradermacher/Huihui-Qwen3-Coder-30B-A3B-Instruct-abliterated-i1-GGUF | 19GB  | redteam | gguf | Lightest uncensored (30B-A3B, imatrix GGUF). Use: --quant Q4_K_M
coder32-gguf      | bartowski/Qwen2.5-Coder-32B-Instruct-GGUF                           | 20GB  | dev     | gguf | GGUF, many quants. Use: --quant Q4_K_M
redteam-4bit      | veeceey/Huihui-Qwen3-Coder-Next-abliterated-mlx-4bit                | 45GB  | redteam | mlx  | Uncensored, larger Qwen3-Coder-Next (MLX 4-bit).
redteam           | AITRADER/Huihui-Qwen3-Coder-Next-abliterated-mlx-8Bit               | 85GB  | redteam | mlx  | Uncensored, larger Qwen3-Coder-Next (MLX 8-bit, top quality).
