# Image model catalog for `fxlla media image`. Format:
#   alias | cli | base_model | steps | caps | note
#
# caps is what the CLI ACTUALLY accepts, read from its --help rather than
# assumed, and it is load-bearing: a flag a model does not support is refused
# with a message naming the model instead of being passed through to fail deep
# in the backend. They differ for real - mage-flow has no LoRA at all.
#   negative     --negative-prompt        lora         --lora PATH [SCALE]
#   prompt-file  --prompt-file            lora-style   mflux's built-in styles
#   dimensions   --width/--height         aspect       --aspect 16:9
#   steps        --steps                  quantize     --quantize
#   seed         --seed                   init-image   --image-path (img2img)
#
# base_model is only needed by the multi-model `mflux-generate` binary.
# An empty steps means the CLI's own default.
# The controlnet and depth entries take an extra input (a control image, a
# depth map) through --control / --depth-image. Models needing a mask or a
# garment (fill, catvton) are still out: those are a different tool shape.

z-image-turbo | mflux-generate-z-image-turbo      |         | 8 | aspect,dimensions,guidance,init-image,lora,lora-style,negative,prompt-file,quantize,seed,steps                                      | Default. Fast distilled Z-Image; good general quality in seconds.
z-image       | mflux-generate-z-image            |         |   | aspect,dimensions,guidance,init-image,lora,lora-style,negative,prompt-file,quantize,seed,steps                                      | Full Z-Image: slower than the turbo, more detail.
boogu         | mflux-generate-boogu              |         | 8 | aspect,dimensions,guidance,lora,lora-style,negative,prompt-file,quantize,seed,steps                                                 | Distilled Boogu; stylized, fast.
flux2-klein   | mflux-generate-flux2              |         |   | aspect,dimensions,guidance,init-image,lora,lora-style,negative,prompt-file,quantize,seed,steps                                      | FLUX.2 Klein.
qwen          | mflux-generate-qwen               |         |   | aspect,dimensions,guidance,init-image,lora,lora-style,negative,prompt-file,quantize,seed,steps                                      | Qwen-Image: strong at text rendering inside images.
krea2         | mflux-generate-krea2              |         |   | aspect,dimensions,guidance,init-image,lora,lora-style,negative,prompt-file,quantize,seed,steps                                      | Krea 2: photographic look.
schnell       | mflux-generate                    | schnell | 4 | aspect,dimensions,guidance,init-image,lora,lora-style,negative,prompt-file,quantize,seed,steps                                      | FLUX.1 schnell: the classic fast baseline.
dev           | mflux-generate                    | dev     |   | aspect,dimensions,guidance,init-image,lora,lora-style,negative,prompt-file,quantize,seed,steps                                      | FLUX.1 dev: slower, higher fidelity.
ideogram4     | mflux-generate-ideogram4          |         |   | aspect,dimensions,guidance,lora,lora-style,negative,prompt-file,quantize,seed,steps                                                 | Ideogram 4: typography and posters. Takes a JSON caption with bboxes.
fibo          | mflux-generate-fibo               |         |   | aspect,dimensions,guidance,init-image,lora,lora-style,negative,prompt-file,quantize,seed,steps                                      | FIBO: long, highly specified prompts.
ernie         | mflux-generate-ernie-image        |         |   | aspect,dimensions,guidance,init-image,lora,lora-style,negative,prompt-file,quantize,seed,steps                                      | ERNIE image.
ernie-turbo   | mflux-generate-ernie-image-turbo  |         | 8 | aspect,dimensions,guidance,init-image,lora,lora-style,negative,prompt-file,quantize,seed,steps                                      | ERNIE image, distilled.
mage-flow     | mflux-generate-mage-flow          |         |   | aspect,dimensions,guidance,negative,prompt-file,quantize,seed,steps                                                                 | Mage Flow. Gated on HuggingFace: needs HF_TOKEN and accepted terms.
controlnet    | mflux-generate-controlnet         |         |   | aspect,controlnet,controlnet-image,controlnet-strength,dimensions,guidance,lora,lora-style,negative,prompt-file,quantize,seed,steps | FLUX + ControlNet. Stack with --control IMAGE[,CHECKPOINT], repeatable.
z-controlnet  | mflux-generate-z-image-controlnet |         | 8 | aspect,control-spec,controlnet-strength,dimensions,guidance,lora,lora-style,negative,prompt-file,quantize,seed,steps                | Z-Image Turbo + ControlNet Union. Stack with --control type:path[:strength].
depth         | mflux-generate-depth              |         |   | aspect,depth-image,dimensions,guidance,init-image,lora,lora-style,negative,prompt-file,quantize,save-depth,seed,steps               | Depth-conditioned FLUX. Derives the depth map, or takes one.
