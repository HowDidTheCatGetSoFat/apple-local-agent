# Image model catalog for `fxlla media image`. Format:
#   alias | cli | base_model | steps | caps | note
#
# caps is what the CLI ACTUALLY accepts, read from its --help rather than
# assumed, and it is load-bearing: a flag a model does not support is refused
# with a message naming the model instead of being passed through to fail deep
# in the backend. They differ for real - mage-flow has no LoRA at all.
#   negative     --negative-prompt        lora         --lora PATH [SCALE]
#   prompt-file  --prompt-file            lora-style   mflux's built-in styles
#   dimensions   --width/--height         aspect       --aspect 16:9
#   steps        --steps                  quantize     --quantize
#   seed         --seed                   init-image   --image-path (img2img)
#
# base_model is only needed by the multi-model `mflux-generate` binary.
# An empty steps means the CLI's own default.
# Models that need a control image, a mask or a garment (controlnet, fill,
# catvton) are not listed: they take different inputs, not just a prompt.

z-image-turbo | mflux-generate-z-image-turbo     |         | 8 | aspect,dimensions,init-image,lora,lora-style,negative,prompt-file,quantize,seed,steps | Default. Fast distilled Z-Image; good general quality in seconds.
z-image       | mflux-generate-z-image           |         |   | aspect,dimensions,init-image,lora,lora-style,negative,prompt-file,quantize,seed,steps | Full Z-Image: slower than the turbo, more detail.
boogu         | mflux-generate-boogu             |         | 8 | aspect,dimensions,lora,lora-style,negative,prompt-file,quantize,seed,steps            | Distilled Boogu; stylized, fast.
flux2-klein   | mflux-generate-flux2             |         |   | aspect,dimensions,init-image,lora,lora-style,negative,prompt-file,quantize,seed,steps | FLUX.2 Klein.
qwen          | mflux-generate-qwen              |         |   | aspect,dimensions,init-image,lora,lora-style,negative,prompt-file,quantize,seed,steps | Qwen-Image: strong at text rendering inside images.
krea2         | mflux-generate-krea2             |         |   | aspect,dimensions,init-image,lora,lora-style,negative,prompt-file,quantize,seed,steps | Krea 2: photographic look.
schnell       | mflux-generate                   | schnell | 4 | aspect,dimensions,init-image,lora,lora-style,negative,prompt-file,quantize,seed,steps | FLUX.1 schnell: the classic fast baseline.
dev           | mflux-generate                   | dev     |   | aspect,dimensions,init-image,lora,lora-style,negative,prompt-file,quantize,seed,steps | FLUX.1 dev: slower, higher fidelity.
ideogram4     | mflux-generate-ideogram4         |         |   | aspect,dimensions,lora,lora-style,negative,prompt-file,quantize,seed,steps            | Ideogram 4: typography and poster layouts.
fibo          | mflux-generate-fibo              |         |   | aspect,dimensions,init-image,lora,lora-style,negative,prompt-file,quantize,seed,steps | FIBO: long, highly specified prompts.
ernie         | mflux-generate-ernie-image       |         |   | aspect,dimensions,init-image,lora,lora-style,negative,prompt-file,quantize,seed,steps | ERNIE image.
ernie-turbo   | mflux-generate-ernie-image-turbo |         | 8 | aspect,dimensions,init-image,lora,lora-style,negative,prompt-file,quantize,seed,steps | ERNIE image, distilled.
