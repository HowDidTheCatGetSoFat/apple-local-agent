# Media weight catalog. Format:
#   alias | hf_repos | approx size | kind | include | note
#
# hf_repos: one or more Hugging Face repositories, comma separated. All of them
#           are needed for that alias to render.
# size:     approximate size of what gets fetched (decimal GB), from the HF API.
# kind:     image, edit, upscale, video, or voice.
# include:  glob passed to `hf download --include` when only part of the repo is
#           needed, or `-` for the whole repository. Blind full-repo downloads
#           over-fetch badly for repos that ship many variants.
#
# `fxlla media weights` lists these with their cached state.
# `fxlla pull media:<alias>` pre-fetches them into the media Hugging Face cache
# (FXLLA_MEDIA_HF_HOME, or the HF default when unset) - the same place the
# toolchains read, so a render finds them.
#
# Pre-fetching is optional: the toolchains download what they need on first use.
# Pull ahead of time to control when a large transfer happens, to put weights on
# a chosen disk, or to work offline afterwards.

z-image-turbo | Tongyi-MAI/Z-Image-Turbo                                   | 33GB | image   | - | Default image model. Fast, 8 steps.
z-image       | Tongyi-MAI/Z-Image                                         | 21GB | image   | - | Full Z-Image, more steps than the turbo variant.
boogu         | Boogu/Boogu-Image-0.1-Turbo                                | 39GB | image   | - | Boogu Image 0.1 Turbo.
flux2-klein   | black-forest-labs/FLUX.2-klein-4B                          | 24GB | image   | - | FLUX.2 klein 4B. Other klein variants exist via mflux --model.
qwen          | Qwen/Qwen-Image-2512                                       | 58GB | image   | - | Qwen-Image 2512.
krea2         | krea/Krea-2-Turbo                                          | 62GB | image   | - | Krea 2 Turbo. Repo ships several variants.
schnell       | black-forest-labs/FLUX.1-schnell                           | 58GB | image   | - | FLUX.1 schnell, 4 steps.
dev           | black-forest-labs/FLUX.1-dev                               | 58GB | image   | - | FLUX.1 dev. License-gated on HF: needs HF_TOKEN.
qwen-edit     | Qwen/Qwen-Image-Edit-2511                                  | 58GB | edit    | - | Instruction-based image editing (fxlla media edit).
seedvr2       | numz/SeedVR2_comfyUI                                       | 7GB  | upscale | *3b_fp16*,*ema_vae_fp16* | Diffusion super-resolution (fxlla media upscale). Only the 3B and VAE files, not the 60GB repo.
ltx           | dgrauet/ltx-2.3-mlx-q8,mlx-community/gemma-3-12b-it-4bit   | 96GB | video   | - | LTX-2.3 video plus the Gemma text encoder its pipelines load.
chatterbox    | YUGOROU/Chatterbox-Multilingual-MLX-4bit                   | 1GB  | voice   | - | Multilingual TTS (fxlla media voice). Also needs a reference wav.
ideogram4     | ideogram-ai/ideogram-4-fp8                                 | 28GB | image   | - | Ideogram 4 (fp8). Typography and poster layouts.
fibo          | briaai/FIBO                                                | 26GB | image   | - | FIBO. Responds to long, highly specified prompts.
ernie         | baidu/ERNIE-Image                                          | 32GB | image   | - | ERNIE image.
ernie-turbo   | baidu/ERNIE-Image-Turbo                                    | 32GB | image   | - | ERNIE image, distilled (fewer steps).
mage-flow     | microsoft/Mage-Flow-Turbo                                  | 16GB | image   | - | Mage Flow Turbo. Gated on HuggingFace: needs HF_TOKEN and accepted terms.
z-controlnet  | alibaba-pai/Z-Image-Turbo-Fun-Controlnet-Union-2.1,Tongyi-MAI/Z-Image-Turbo | 40GB | image   | - | ControlNet Union: the adapter AND the Z-Image Turbo base.
depth         | black-forest-labs/FLUX.1-Depth-dev                         | 68GB | image   | - | Depth-conditioned FLUX. Large: it ships the full base model.
controlnet    | InstantX/FLUX.1-dev-Controlnet-Canny,black-forest-labs/FLUX.1-dev | 62GB | image   | - | ControlNet for FLUX: the adapter AND the dev base weights.
